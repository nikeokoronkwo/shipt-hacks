[project]
name = "shelterconnect-backend"
version = "0.1.0"
description = "ShelterConnect FastAPI backend starter"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.15.1,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
