[project]
name = "shiptohome"
version = "0.1.0"
description = "ShelterConnect FastAPI application service"
readme = "README.md"
authors = [
    { name = "Nikechukwu Okoronkwo", email = "nikechukwu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shiptohome = "shiptohome:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
